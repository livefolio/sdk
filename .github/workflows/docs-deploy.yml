name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'typedoc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'typedoc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Single concurrent deploy; cancel in-progress runs of this workflow on the same ref.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check docs samples
        run: npm run docs:check

      - name: Build docs site (TypeDoc + VitePress)
        run: npm run docs:build

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
